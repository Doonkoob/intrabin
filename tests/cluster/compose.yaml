# Three-node Intrabin cluster for local testing (not a production template).
#   docker compose -f tests/cluster/compose.yaml up -d
#   tests/cluster/run_compose.sh   # builds, starts, runs the failover test, tears down
# Node UIs: http://127.0.0.1:18081 (node1), :18082 (node2), :18083 (node3).
# Each node starts fresh with the same setup token; the test founds the cluster on node1 and
# joins node2/node3 through the first-run "join a cluster" API. Peers talk over mTLS on 7443.
name: intrabin-cluster

x-node: &node
  image: ${INTRABIN_IMAGE:-intrabin/intrabin:latest}
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test: ["CMD", "/usr/local/bin/intrabin", "healthcheck"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 10s
  networks: [mesh]

x-env: &env
  INTRABIN_DATA_DIR: /var/lib/intrabin
  INTRABIN_LISTEN: ":8080"
  INTRABIN_CLUSTER_LISTEN: ":7443"
  INTRABIN_SETUP_TOKEN: compose-cluster-setup-token-0123
  INTRABIN_MIN_INTERVAL: 5s
  INTRABIN_LOG_LEVEL: info

services:
  node1:
    <<: *node
    environment:
      <<: *env
      INTRABIN_NODE_NAME: node1
      INTRABIN_NODE_LOCATION: zone-a
      INTRABIN_CLUSTER_ADVERTISE: node1:7443
      INTRABIN_PUBLIC_URL: http://127.0.0.1:18081
    ports: ["127.0.0.1:18081:8080"]
    volumes: [node1-data:/var/lib/intrabin]
  node2:
    <<: *node
    environment:
      <<: *env
      INTRABIN_NODE_NAME: node2
      INTRABIN_NODE_LOCATION: zone-b
      INTRABIN_CLUSTER_ADVERTISE: node2:7443
      INTRABIN_PUBLIC_URL: http://127.0.0.1:18082
    ports: ["127.0.0.1:18082:8080"]
    volumes: [node2-data:/var/lib/intrabin]
  node3:
    <<: *node
    environment:
      <<: *env
      INTRABIN_NODE_NAME: node3
      INTRABIN_NODE_LOCATION: zone-c
      INTRABIN_CLUSTER_ADVERTISE: node3:7443
      INTRABIN_PUBLIC_URL: http://127.0.0.1:18083
    ports: ["127.0.0.1:18083:8080"]
    volumes: [node3-data:/var/lib/intrabin]
  # An HTTP target every node probes during the test (a throwaway standalone instance whose
  # health endpoint answers 200; no extra image needed).
  target:
    image: ${INTRABIN_IMAGE:-intrabin/intrabin:latest}
    read_only: true
    tmpfs:
      - /var/lib/intrabin:size=32m,uid=65532,gid=65532
      - /tmp:size=8m
    environment:
      INTRABIN_SETUP_TOKEN: target-not-used-0123456789
      INTRABIN_LOG_LEVEL: warn
    networks: [mesh]

networks:
  mesh: {}

volumes:
  node1-data: {}
  node2-data: {}
  node3-data: {}
