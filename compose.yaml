# Intrabin — single-node production deployment.
#   One-command install on Ubuntu: see README (scripts/install.sh), or manually:
#   cp .env.example .env && docker compose up -d
#   docker compose logs intrabin | grep setup_token
# Optional profiles (COMPOSE_PROFILES in .env): "proxy" (Caddy with automatic HTTPS for
# INTRABIN_DOMAIN), "automation" (isolated Action Runner).
name: intrabin

services:
  intrabin:
    image: ${INTRABIN_IMAGE:-intrabin/intrabin:latest}
    build:
      context: .
      args:
        VERSION: ${INTRABIN_VERSION:-dev}
        GOPROXY_URL: ${GOPROXY_URL:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    restart: unless-stopped
    env_file: .env
    environment:
      INTRABIN_DATA_DIR: /var/lib/intrabin
      INTRABIN_LISTEN: ":8080"
    ports:
      # Bound to localhost by default. Put a TLS reverse proxy in front, or change the
      # bind address only together with INTRABIN_TLS_CERT/KEY and a firewall.
      - "${INTRABIN_BIND:-127.0.0.1}:${INTRABIN_PORT:-8080}:8080"
    volumes:
      - intrabin-data:/var/lib/intrabin
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "/usr/local/bin/intrabin", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional isolated Action Runner for workflow script steps:
  #   docker compose --profile automation up -d
  # and set INTRABIN_RUNNER_URL=http://runner:8090 and INTRABIN_RUNNER_TOKEN in .env.
  runner:
    profiles: [automation]
    image: ${INTRABIN_RUNNER_IMAGE:-intrabin/runner:latest}
    build:
      context: .
      dockerfile: Dockerfile.runner
      args:
        GOPROXY_URL: ${GOPROXY_URL:-}
    restart: unless-stopped
    environment:
      INTRABIN_RUNNER_TOKEN: ${INTRABIN_RUNNER_TOKEN:-}  # required (>= 24 chars); the runner refuses to start without it
      INTRABIN_LOG_LEVEL: ${INTRABIN_LOG_LEVEL:-info}
    # No published ports: only the intrabin service reaches it on the Compose network.
    volumes:
      - runner-data:/var/lib/intrabin-runner
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m
          pids: 256

  # Optional TLS reverse proxy with automatic Let's Encrypt certificates and renewal:
  # set INTRABIN_DOMAIN, generate deploy/Caddyfile (scripts/install.sh does both) and
  #   docker compose --profile proxy up -d
  caddy:
    profiles: [proxy]
    image: ${CADDY_IMAGE:-caddy:2.10-alpine}
    restart: unless-stopped
    depends_on: [intrabin]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  intrabin-data:
  runner-data:
  caddy-data:
  caddy-config:
