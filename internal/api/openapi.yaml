openapi: 3.1.0
info:
  title: Intrabin API
  version: "1"
  description: |
    Versioned management API of an Intrabin node. Authentication uses an HttpOnly session cookie
    (`intrabin_session`) obtained from `POST /auth/login`. Every non-GET request must send the
    session's CSRF token (from `GET /auth/me`) in the `X-CSRF-Token` header.
    All timestamps are RFC 3339 UTC. Errors use a uniform body:
    `{"error":{"code":"validation_failed","message":"...","fields":{"name":"..."}}}`.
    Management endpoints return `409 node_read_only` on nodes that are not the active controller.
  license: { name: Apache-2.0 }
servers:
  - url: /api/v1
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: intrabin_session }
    csrf: { type: apiKey, in: header, name: X-CSRF-Token }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, examples: [validation_failed, unauthorized, forbidden, not_found, conflict, csrf_failed, rate_limited, node_read_only, no_quorum, workflow_busy, invalid_state, invalid_transition, dns_conflict, dns_no_change, dns_ambiguous, dns_invalid, dns_auth, dns_not_found, dns_rate_limited, dns_provider_error, dns_provider_in_use, internal] }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
    WorkflowInput:
      type: object
      required: [name, trigger, steps]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string }
        enabled: { type: boolean, default: false }
        operator_can_run: { type: boolean, default: false }
        trigger:
          type: object
          properties:
            type: { type: string, enum: [manual, incident, schedule, condition] }
            metric: { type: string, enum: [latency_ms, status_code, uptime_24h, cert_days, status], description: "condition: the value compared after each check round" }
            op: { type: string, enum: [gt, ge, lt, le, eq, ne], description: "condition: comparison (status allows eq and ne only)" }
            threshold: { type: number, description: "condition: number compared with the metric" }
            status_value: { type: string, enum: [UP, DEGRADED, SUSPECTED_DOWN, DOWN, UNKNOWN, MAINTENANCE], description: "condition with metric status" }
            repeat_minutes: { type: integer, minimum: 1, maximum: 10080, default: 60, description: "condition: while the condition keeps holding, start at most one run per this many minutes per monitor" }
            on_statuses: { type: array, items: { type: string }, description: "incident: statuses that start a run (default CONFIRMED)" }
            monitor_ids: { type: array, items: { type: string } }
            group_ids: { type: array, items: { type: string } }
            tags: { type: array, items: { type: string } }
            interval_seconds: { type: integer, minimum: 60, description: schedule interval }
        steps:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string, enum: [script, http, wait, incident_status, dns] }
              timeout_seconds: { type: integer }
              on_failure: { type: string, enum: [stop, continue] }
              retries: { type: integer, minimum: 0, maximum: 5, description: retries after a definite failure only }
              language: { type: string, enum: [bash, python] }
              script: { type: string }
              env: { type: object, additionalProperties: { type: string } }
              method: { type: string }
              url: { type: string, description: "http(s); {{placeholders}} allowed in path and query" }
              headers: { type: object, additionalProperties: { type: string } }
              body: { type: string }
              expected_status: { type: array, items: { type: string }, examples: [["2xx", "409"]] }
              allow_private_network: { type: boolean, default: false }
              seconds: { type: integer, description: wait duration }
              status: { type: string, description: incident_status target }
              note: { type: string }
              provider_id: { type: string, description: "dns: DNS integration ID" }
              zone_name: { type: string, description: "dns: zone name (or zone_id)" }
              zone_id: { type: string }
              dns_action: { type: string, enum: [upsert, delete] }
              record_type: { type: string, enum: [A, AAAA, CNAME, TXT] }
              record_name: { type: string, description: "dns: FQDN or name relative to the zone; placeholders allowed" }
              content: { type: string, description: "dns: record value; placeholders allowed" }
              ttl: { type: integer, description: "dns: 1 = automatic, otherwise 30-86400" }
              proxied: { type: boolean, description: "dns: Cloudflare proxy" }
        secrets: { type: object, additionalProperties: { type: string }, writeOnly: true }
        clear_secrets: { type: boolean }
    DNSRecordInput:
      type: object
      properties:
        type: { type: string, enum: [A, AAAA, CNAME, TXT] }
        name: { type: string, description: "FQDN inside the zone, a relative name, or @ for the apex" }
        content: { type: string }
        ttl: { type: integer, description: "1 = automatic (Cloudflare auto; ArvanCloud 120 s), otherwise 30-86400" }
        proxied: { type: boolean, description: "Cloudflare proxy / ArvanCloud cloud flag" }
    DNSChangeRequest:
      type: object
      required: [provider_id, zone, action]
      properties:
        provider_id: { type: string }
        zone: { type: string, description: zone ID or name }
        action: { type: string, enum: [upsert, delete, create] }
        record_id: { type: string, description: "the exact record to change; otherwise matched by type + name (must be unique)" }
        record: { $ref: '#/components/schemas/DNSRecordInput' }
    DNSPlan:
      type: object
      description: Result of a dry run. Send it back unchanged when applying; the change is refused with dns_conflict if the record changed since.
      properties:
        provider_id: { type: string }
        zone: { type: object, properties: { id: { type: string }, name: { type: string }, status: { type: string } } }
        action: { type: string, enum: [create, update, delete] }
        before: { type: object }
        after: { type: object }
        no_change: { type: boolean }
        warnings: { type: array, items: { type: string } }
    Role: { type: string, enum: [owner, admin, operator, viewer] }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        disabled: { type: boolean }
        language: { type: string, enum: [en, fa] }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }
    Policy:
      type: object
      description: Multi-location verification policy. Rounds are interval-aligned; a round fails only with enough independent confirmations.
      properties:
        confirmations_required: { type: integer, minimum: 1 }
        min_locations: { type: integer, minimum: 1 }
        min_valid_probes: { type: integer, minimum: 1 }
        fail_mode: { type: string, enum: [consecutive, window] }
        failure_rounds: { type: integer, minimum: 1 }
        window_seconds: { type: integer }
        recovery_rounds: { type: integer, minimum: 1 }
        cooldown_seconds: { type: integer, minimum: 0 }
    MonitorSettings:
      type: object
      properties:
        method: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        body: { type: string }
        expected_status: { type: array, items: { type: string }, examples: [["200-299", "301"]] }
        expected_body: { type: string }
        follow_redirects: { type: boolean }
        max_redirects: { type: integer }
        skip_tls_verify: { type: boolean }
        origin_address: { type: string, description: "Connect to this IP[:port] while keeping URL host for Host/SNI" }
        host_header: { type: string }
        tls_server_name: { type: string }
        degraded_latency_ms: { type: integer }
        cert_expiry_warn_days: { type: integer }
        cert_expiry_fail_days: { type: integer }
        record_type: { type: string, enum: [A, AAAA, CNAME, MX, TXT, NS] }
        expected_value: { type: string }
        resolver: { type: string }
        check_path: { type: string, enum: [public, origin, internal] }
    MonitorInput:
      type: object
      required: [name, target]
      properties:
        name: { type: string }
        description: { type: string }
        type: { type: string, enum: [http, tcp, dns, tls], default: http }
        target: { type: string }
        group_id: { type: string }
        tags: { type: array, items: { type: string } }
        interval_seconds: { type: integer, default: 60 }
        timeout_seconds: { type: integer }
        retries: { type: integer, minimum: 0, maximum: 5 }
        enabled: { type: boolean }
        settings: { $ref: '#/components/schemas/MonitorSettings' }
        policy: { $ref: '#/components/schemas/Policy' }
        node_ids: { type: array, items: { type: string } }
        secrets:
          type: object
          description: Write-only. Encrypted at rest (AES-256-GCM); never returned.
          properties:
            basic_auth_user: { type: string }
            basic_auth_password: { type: string }
            secret_headers: { type: object, additionalProperties: { type: string } }
        clear_secrets: { type: boolean }
    MonitorState:
      type: object
      properties:
        status: { type: string, enum: [UP, DOWN, DEGRADED, SUSPECTED_DOWN, UNKNOWN, PAUSED, MAINTENANCE] }
        consecutive_failed: { type: integer }
        consecutive_ok: { type: integer }
        last_verdict: { type: string, enum: [ok, partial, failed, inconclusive, maintenance] }
        last_latency_ms: { type: number }
        status_since: { type: string, format: date-time }
    Monitor:
      allOf:
        - $ref: '#/components/schemas/MonitorInput'
        - type: object
          properties:
            id: { type: string }
            version: { type: integer, description: Incremented whenever probe-relevant configuration changes }
            secret_keys: { type: array, items: { type: string }, description: Names of stored secrets only }
            state: { $ref: '#/components/schemas/MonitorState' }
            uptime_24h: { type: [number, "null"] }
    CheckResult:
      type: object
      properties:
        id: { type: string }
        monitor_id: { type: string }
        node_id: { type: string }
        config_version: { type: integer }
        round_start: { type: string, format: date-time }
        probe_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        success: { type: boolean }
        latency_ms: { type: number }
        http_status: { type: integer, description: Only set when an HTTP response was received }
        error_category: { type: string, enum: ["", http_5xx, unexpected_status, body_mismatch, timeout, dns_failure, connection_refused, network_unreachable, connection_reset, tls_error, cert_expiring, dns_mismatch, invalid_config, unknown] }
        error_message: { type: string }
        attempts: { type: integer }
    UptimeStats:
      type: object
      properties:
        ok_rounds: { type: integer }
        partial_rounds: { type: integer }
        failed_rounds: { type: integer }
        inconclusive_rounds: { type: integer }
        maintenance_rounds: { type: integer }
        expected_rounds: { type: integer }
        availability: { type: [number, "null"], description: "(ok+partial)/(ok+partial+failed) in percent" }
        coverage: { type: [number, "null"], description: "conclusive rounds / expected rounds in percent" }
    Incident:
      type: object
      properties:
        id: { type: string }
        monitor_id: { type: string }
        monitor_name: { type: string }
        status: { type: string, enum: [SUSPECTED, CONFIRMED, ACKNOWLEDGED, RECOVERY_PENDING, RECOVERING, FAILED_OVER, RESOLVED, MANUAL_INTERVENTION, UNKNOWN] }
        started_at: { type: string, format: date-time }
        detected_at: { type: string, format: date-time }
        confirmed_at: { type: string, format: date-time }
        acknowledged_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        resolution: { type: string }
        confirmation_sources: { type: array, items: { type: string } }
    Note:
      type: object
      properties: { note: { type: string, maxLength: 2000 } }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
security:
  - session: []
    csrf: []
paths:
  /health:
    get: { summary: Liveness, security: [], responses: { '200': { description: Process is running } } }
  /readiness:
    get: { summary: Readiness (database reachable), security: [], responses: { '200': { description: Ready }, '503': { description: Not ready } } }
  /setup/status:
    get: { summary: Whether initial setup is required, security: [], responses: { '200': { description: OK } } }
  /setup:
    post:
      summary: Create the first owner account (one-time, requires the setup token from the logs)
      security: []
      requestBody: { content: { application/json: { schema: { type: object, required: [setup_token, username, password], properties: { setup_token: { type: string }, username: { type: string }, password: { type: string, minLength: 10 }, display_name: { type: string }, language: { type: string }, instance_name: { type: string } } } } } }
      responses: { '201': { description: Created; session cookie set }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /auth/login:
    post:
      summary: Sign in (rate limited per IP and per username)
      security: []
      requestBody: { content: { application/json: { schema: { type: object, properties: { username: { type: string }, password: { type: string } } } } } }
      responses: { '200': { description: Session cookie set }, '401': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /auth/logout: { post: { summary: Sign out, responses: { '200': { description: OK } } } }
  /auth/me: { get: { summary: Current user, CSRF token, permissions and node info, responses: { '200': { description: OK } } } }
  /auth/password:
    post: { summary: Change own password (revokes other sessions), requestBody: { content: { application/json: { schema: { type: object, properties: { current_password: { type: string }, new_password: { type: string } } } } } }, responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Error' } } }
  /auth/profile:
    patch: { summary: Update own display name / language, responses: { '200': { description: OK } } }
  /users:
    get: { summary: List users (user.manage), responses: { '200': { description: OK } } }
    post: { summary: Create user, responses: { '201': { description: Created }, '403': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } } }
  /users/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch: { summary: Update role / disabled / display name (last-owner and self protections apply), responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Error' } } }
    delete: { summary: Delete user, responses: { '200': { description: OK } } }
  /users/{id}/password:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { summary: Administrative password reset (revokes sessions), responses: { '200': { description: OK } } }
  /monitors:
    get:
      summary: List monitors with state and 24h uptime
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: group_id, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { monitors: { type: array, items: { $ref: '#/components/schemas/Monitor' } } } } } } } }
    post:
      summary: Create monitor (monitor.manage)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/MonitorInput' } } } }
      responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Error' } }
  /monitors/test:
    post: { summary: Run one probe with the submitted configuration without saving it, requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/MonitorInput' } } } }, responses: { '200': { description: Probe outcome } } }
  /monitors/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { summary: Get monitor, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
    put: { summary: Replace monitor definition (secrets kept unless provided or cleared), requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/MonitorInput' } } } }, responses: { '200': { description: OK } } }
    delete: { summary: Delete monitor and its history, responses: { '200': { description: OK } } }
  /monitors/{id}/pause: { parameters: [{ name: id, in: path, required: true, schema: { type: string } }], post: { summary: Pause, responses: { '200': { description: OK } } } }
  /monitors/{id}/resume: { parameters: [{ name: id, in: path, required: true, schema: { type: string } }], post: { summary: Resume, responses: { '200': { description: OK } } } }
  /monitors/{id}/results:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      summary: Raw probe results, newest first
      parameters: [{ name: range, in: query, schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d, 90d] } }, { name: limit, in: query, schema: { type: integer, maximum: 5000 } }, { name: node_id, in: query, schema: { type: string } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { results: { type: array, items: { $ref: '#/components/schemas/CheckResult' } } } } } } } }
  /monitors/{id}/uptime:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { summary: Availability and coverage for 24h/7d/30d/90d plus 90 daily buckets, responses: { '200': { description: OK } } }
  /monitors/{id}/stats:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: range, in: query, schema: { type: string } }]
    get: { summary: Latency series, status code / error / per-node breakdown, recent rounds, certificate expiry, incidents, responses: { '200': { description: OK } } }
  /monitor-groups:
    get: { summary: List groups, responses: { '200': { description: OK } } }
    post: { summary: Create group, responses: { '201': { description: Created } } }
  /monitor-groups/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch: { summary: Update group, responses: { '200': { description: OK } } }
    delete: { summary: Delete group (monitors become ungrouped), responses: { '200': { description: OK } } }
  /incidents:
    get:
      summary: List incidents
      parameters: [{ name: open, in: query, schema: { type: boolean } }, { name: status, in: query, schema: { type: string } }, { name: monitor_id, in: query, schema: { type: string } }, { name: before, in: query, schema: { type: string, format: date-time } }, { name: limit, in: query, schema: { type: integer } }]
      responses: { '200': { description: OK } }
  /incidents/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { summary: Incident with timeline events, responses: { '200': { description: OK } } }
  /incidents/{id}/acknowledge: { parameters: [{ name: id, in: path, required: true, schema: { type: string } }], post: { summary: Acknowledge (incident.respond), requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } }, responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Error' } } } }
  /incidents/{id}/resolve: { parameters: [{ name: id, in: path, required: true, schema: { type: string } }], post: { summary: Resolve manually, requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } }, responses: { '200': { description: OK } } } }
  /incidents/{id}/notes: { parameters: [{ name: id, in: path, required: true, schema: { type: string } }], post: { summary: Add timeline note, requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } }, responses: { '200': { description: OK } } } }
  /maintenance-windows:
    get: { summary: List current, upcoming and recent windows, responses: { '200': { description: OK } } }
    post: { summary: Create window (monitor_id empty = all monitors), responses: { '201': { description: Created } } }
  /maintenance-windows/{id}: { parameters: [{ name: id, in: path, required: true, schema: { type: string } }], delete: { summary: Delete window, responses: { '200': { description: OK } } } }
  /overview: { get: { summary: Dashboard aggregates, responses: { '200': { description: OK } } } }
  /overview/node-latency:
    get:
      summary: "Average latency and failed probes per monitoring node, overall and per monitor (from hourly aggregates)"
      parameters: [{ name: window, in: query, schema: { type: string, enum: ['1h', '24h', '7d', '30d'], default: '24h' } }]
      responses: { '200': { description: "{ window, nodes: [{ id, name, probes, failures, avg_latency_ms }], monitors: [{ id, name, nodes: { node_id: cell } }] }" } }
  /overview/certificates: { get: { summary: "TLS certificate expiry for HTTP(S) and TLS monitors, soonest first (days_left, expires_at, cert_fail_days)", responses: { '200': { description: OK } } } }
  /system/storage: { get: { summary: "Database size on this node (file and per-table bytes and rows) and the retention in force", responses: { '200': { description: OK } } } }
  /audit-logs:
    get:
      summary: Searchable audit log (audit.view)
      parameters: [{ name: q, in: query, schema: { type: string } }, { name: action, in: query, schema: { type: string }, description: Action prefix }, { name: actor, in: query, schema: { type: string } }, { name: target_id, in: query, schema: { type: string } }, { name: since, in: query, schema: { type: string, format: date-time } }, { name: before, in: query, schema: { type: string, format: date-time } }, { name: limit, in: query, schema: { type: integer } }]
      responses: { '200': { description: OK } }
  /settings:
    get: { summary: Instance settings, responses: { '200': { description: OK } } }
    patch: { summary: "Update instance settings (settings.manage). log_retention_days: 7, 15, 30, 90, 180, 365, or 0 for the custom per-type retention fields; log_retention_choices is read-only", responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Error' } } }
  /node: { get: { summary: Local node status (available on every node, including followers), responses: { '200': { description: OK } } } }
  /cluster: { get: { summary: "Cluster status: role, leader, Raft term and indexes, mesh gate, members, reachability matrix, warnings", responses: { '200': { description: OK } } } }
  /cluster/init:
    post:
      summary: "Found a new cluster from this standalone node (cluster.manage). Body: { advertise: host:port }"
      responses: { '200': { description: Cluster created; this node is the first voter }, '409': { description: Already clustered } }
  /cluster/join:
    post:
      summary: "Join an existing cluster (owner only). Body: { token, advertise, data_action: export|discard }. Local data is replaced; export writes a backup first."
      responses: { '200': { description: Joined as a non-voter; the session is ended }, '409': { description: "data_present: choose export or discard" }, '502': { description: Cluster unreachable or token rejected } }
  /setup/join:
    post:
      summary: "Join a cluster from a fresh node instead of running setup (requires the node's one-time setup token)"
      responses: { '200': { description: Joined }, '409': { description: Setup already completed } }
  /cluster/tokens:
    get: { summary: List join tokens (metadata only; secrets are never returned again), responses: { '200': { description: OK } } }
    post:
      summary: "Create a single-use join token (cluster.manage, leader). Body: { description, ttl_minutes: 5..1440 }. The token is returned once."
      responses: { '201': { description: Created } }
  /cluster/tokens/{id}: { parameters: [{ name: id, in: path, required: true, schema: { type: string } }], delete: { summary: Revoke an unused token, responses: { '200': { description: OK } } } }
  /cluster/nodes/{id}/promote: { parameters: [{ name: id, in: path, required: true, schema: { type: string } }], post: { summary: Promote a caught-up and reachable non-voter to voter, responses: { '200': { description: OK }, '400': { description: Not reachable or still catching up } } } }
  /cluster/nodes/{id}/demote: { parameters: [{ name: id, in: path, required: true, schema: { type: string } }], post: { summary: Demote a voter to non-voter, responses: { '200': { description: OK } } } }
  /cluster/nodes/{id}: { parameters: [{ name: id, in: path, required: true, schema: { type: string } }], delete: { summary: Remove a member (never automatic), responses: { '200': { description: OK } } } }
  /workflows:
    get: { summary: List workflows (secret values are never returned; secret_keys lists names), responses: { '200': { description: OK } } }
    post:
      summary: "Create a workflow (automation.manage). Disabled unless enabled=true. Body: { name, description, enabled, operator_can_run, trigger, steps[], secrets: {NAME: value} }"
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowInput' } } } }
      responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Error' } }
  /workflows/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { summary: Get a workflow and its 20 most recent runs, responses: { '200': { description: OK } } }
    put:
      summary: "Replace a workflow definition (automation.manage). secrets: omitted keeps all; a key with an empty value keeps that value; clear_secrets removes all."
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowInput' } } } }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Error' } }
    delete: { summary: "Delete a workflow and its run history. 409 workflow_busy while runs are active or have an unknown outcome.", responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } } }
  /workflows/{id}/run:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: "Start a manual run (automation.run; operators only for workflows with operator_can_run). Body: { context: { key: value } }; context.incident_id targets an incident."
      responses: { '202': { description: Run created }, '403': { $ref: '#/components/responses/Error' } }
  /workflow-runs:
    get:
      summary: List runs
      parameters:
        - { name: workflow_id, in: query, schema: { type: string } }
        - { name: status, in: query, description: "Comma-separated: pending, running, waiting, succeeded, failed, cancelled, unknown_outcome", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 500 } }
      responses: { '200': { description: OK } }
  /workflow-runs/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { summary: "Get a run with its action records (status, fence term/leader, exit code, redacted output)", responses: { '200': { description: OK } } }
  /workflow-runs/{id}/cancel:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { summary: "Cancel a run. A step already executing is not interrupted; its result is recorded but no further steps run.", responses: { '200': { description: OK }, '409': { description: Already finished } } }
  /workflow-actions/{id}/reconcile:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: "Record the real outcome of an action in UNKNOWN_OUTCOME (automation.manage). The action is never re-run. Body: { result: succeeded|failed, note (required) }"
      responses: { '200': { description: OK }, '409': { description: The action is not in unknown_outcome }, '422': { $ref: '#/components/responses/Error' } }
  /automation/status:
    get: { summary: "Whether this node executes runs, Action Runner reachability and interpreters, and run counts by status", responses: { '200': { description: OK } } }
  /dns/providers:
    get: { summary: "List DNS integrations (credentials are never returned)", responses: { '200': { description: OK } } }
    post:
      summary: "Add a DNS integration (dns.manage). Body: { name, type: cloudflare|arvancloud, api_token (Cloudflare) | api_key (ArvanCloud) }. Credentials are verified with the provider before they are stored encrypted."
      responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Error' } }
  /dns/providers/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put: { summary: "Rename, or replace the credential (empty keeps the stored one; a new one is verified first)", responses: { '200': { description: OK } } }
    delete: { summary: "Delete an integration (refused with dns_provider_in_use while a workflow step uses it)", responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } } }
  /dns/providers/{id}/verify:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { summary: Re-verify the stored credential, responses: { '200': { description: "{ ok, error }" } } }
  /dns/providers/{id}/zones:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: fresh, in: query, schema: { type: string, enum: ["1"] } }]
    get: { summary: "Zones visible to the credential (cached 30 s)", responses: { '200': { description: OK } } }
  /dns/providers/{id}/zones/{zone}/records:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: zone, in: path, required: true, schema: { type: string } }]
    get: { summary: "Live records of a zone (all pages). Only A, AAAA, CNAME and TXT are editable", responses: { '200': { description: OK } } }
  /dns/providers/{id}/zones/{zone}/snapshots:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: zone, in: path, required: true, schema: { type: string } }]
    post: { summary: Take a snapshot of the zone, responses: { '201': { description: Created } } }
  /dns/changes/plan:
    post:
      summary: Dry run a change against the provider's current records (never writes)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/DNSChangeRequest' } } } }
      responses: { '200': { description: "{ plan: DNSPlan }" }, '422': { $ref: '#/components/responses/Error' } }
  /dns/changes:
    get: { summary: "Change history (filters: provider_id, zone_id, status=comma list, limit)", responses: { '200': { description: OK } } }
    post:
      summary: "Apply a reviewed change. Body: { change: DNSChangeRequest, plan: DNSPlan }. Snapshots the zone, checks for conflicts, fences, writes once, reads back. Uncertain outcomes are settled by reading the zone, never by re-sending."
      responses: { '200': { description: "{ change } with status applied, failed, reconciled_applied, reconciled_not_applied or unknown_outcome" }, '409': { $ref: '#/components/responses/Error' } }
  /dns/changes/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { summary: One change, responses: { '200': { description: OK } } }
  /dns/changes/{id}/revert:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { summary: "Undo an applied change. Body: { dry_run: true } returns the plan; { plan } applies it", responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Error' } } }
  /dns/changes/{id}/reconcile:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { summary: "Record the verified outcome of an unknown_outcome change. Body: { result: applied|not_applied, note (required) }. A workflow action with the same ID is reconciled too.", responses: { '200': { description: OK } } }
  /dns/snapshots:
    get: { summary: "Snapshots without records (filters: provider_id, zone_id, limit)", responses: { '200': { description: OK } } }
  /dns/snapshots/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { summary: Snapshot with its records, responses: { '200': { description: OK } } }
  /dns/snapshots/{id}/restore:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { summary: "Restore editable records. Body: { dry_run, include_deletes, plans }. Apply with the plans from the dry run; stops at the first change that did not definitely apply.", responses: { '200': { description: "{ changes, planned, error? }" }, '409': { $ref: '#/components/responses/Error' } } }
  /dr-plans:
    get: { summary: "DR plans with their state (primary, failing_over, failed_over, failing_back, attention) and why an automatic failover is waiting", responses: { '200': { description: "{ plans }" } } }
    post:
      summary: "Create a DR plan. Body: { name, description, config: { monitor_ids, secondary_monitor_id, automatic, cooldown_seconds, provider_id, zone_name, record_type A|AAAA|CNAME, record_name, primary_value, secondary_value, ttl, proxied, pre_steps, post_steps } }. Requires dr.manage"
      responses: { '201': { description: "{ plan }" }, '422': { $ref: '#/components/responses/Error' } }
  /dr-plans/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { summary: "Plan and its switch runs", responses: { '200': { description: "{ plan, runs }" } } }
    put: { summary: "Update a plan (not while a switch is running)", responses: { '200': { description: "{ plan }" }, '409': { $ref: '#/components/responses/Error' } } }
    delete: { summary: "Delete a plan (not while a switch is running). DNS is not changed", responses: { '204': { description: Deleted } } }
  /dr-plans/{id}/preview:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { summary: "Dry run. Body: { direction: failover|failback }. Returns the safety checks, the DNS plan and the steps; never writes", responses: { '200': { description: "{ result: { checks, steps, dns } }" } } }
  /dr-plans/{id}/failover:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { summary: "Start a failover on the active controller. Body: { note, force }. force overrides overridable checks and requires a note. The state change and the run are created in one replicated transition", responses: { '200': { description: "{ result: { checks, run } }" }, '409': { $ref: '#/components/responses/Error' } } }
  /dr-plans/{id}/failback:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { summary: "Start a failback (always manual). Body: { note, force }", responses: { '200': { description: "{ result: { checks, run } }" }, '409': { $ref: '#/components/responses/Error' } } }
  /dr-plans/{id}/resolve:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { summary: "Leave the attention state after a person verified where traffic goes. Body: { state: primary|failed_over, note (required) }. Nothing is changed at the provider", responses: { '200': { description: "{ plan }" } } }
