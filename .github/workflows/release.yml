name: Release images
# Tags publish images and archives; manual dispatch repairs archives of an existing image release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to publish or repair
        required: true
        type: string
permissions:
  contents: write # the GitHub release that the in-app update check reads
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_VERSION }}
      - name: Validate version and release notes
        run: |
          test "$(cat VERSION)" = "${RELEASE_VERSION}"
          test -s "docs/releases/${RELEASE_VERSION}.md"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "app=ghcr.io/${owner}/intrabin" >> "$GITHUB_OUTPUT"
          echo "runner=ghcr.io/${owner}/intrabin-runner" >> "$GITHUB_OUTPUT"
      - name: Build and push Intrabin
        if: github.event_name == 'push'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --build-arg VERSION="${RELEASE_VERSION}" --build-arg COMMIT="$(git rev-parse HEAD)" \
            -t "${{ steps.names.outputs.app }}:${RELEASE_VERSION}" -t "${{ steps.names.outputs.app }}:latest" .
      - name: Build and push the Action Runner
        if: github.event_name == 'push'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push -f Dockerfile.runner \
            --build-arg VERSION="${RELEASE_VERSION}" \
            -t "${{ steps.names.outputs.runner }}:${RELEASE_VERSION}" -t "${{ steps.names.outputs.runner }}:latest" .
      - name: GitHub release
        # Created after the images are published, so the update notice never points at a release
        # whose images are missing. Pre-release tags (v1.2.0-rc1) are never offered as updates.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${RELEASE_VERSION}" >/dev/null 2>&1 && exit 0
          pre=""
          case "${RELEASE_VERSION}" in *-*) pre="--prerelease" ;; esac
          gh release create "${RELEASE_VERSION}" --draft --verify-tag --notes-file "docs/releases/${RELEASE_VERSION}.md" --title "Intrabin ${RELEASE_VERSION}" $pre
      - name: Publish downloadable images for restricted registries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ steps.names.outputs.app }}
          RUNNER_IMAGE: ${{ steps.names.outputs.runner }}
        run: |
          for arch in amd64 arm64; do
            for package in intrabin intrabin-runner; do
              image="$APP_IMAGE"
              if [ "$package" = intrabin-runner ]; then image="$RUNNER_IMAGE"; fi
              docker pull --platform "linux/$arch" "$image:$RELEASE_VERSION"
              archive="$package-linux-$arch.tar.gz"
              docker save --platform "linux/$arch" "$image:$RELEASE_VERSION" | gzip -1 > "$archive"
              python3 - "$archive" "$arch" <<'PY_VERIFY'
          import json, sys, tarfile
          with tarfile.open(sys.argv[1]) as archive:
              manifests = json.load(archive.extractfile("manifest.json"))
              assert len(manifests) == 1, "Archive must contain exactly one image"
              config = json.load(archive.extractfile(manifests[0]["Config"]))
              assert config["architecture"] == sys.argv[2], config["architecture"]
          PY_VERIFY
              docker image load --input "$archive" >/dev/null
              gh release upload "$RELEASE_VERSION" "$archive" --clobber
              rm "$archive"
            done
          done
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_VERSION" --draft=false
