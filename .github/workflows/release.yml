name: Release images
# Runs only when a version tag (v1.2.3) is pushed. Publishes multi-arch images to GitHub's container
# registry so the installer can pull them (install.sh --release v1.2.3) instead of building.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write # the GitHub release that the in-app update check reads
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and release notes
        run: |
          test "$(cat VERSION)" = "${GITHUB_REF_NAME}"
          test -s "docs/releases/${GITHUB_REF_NAME}.md"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "app=ghcr.io/${owner}/intrabin" >> "$GITHUB_OUTPUT"
          echo "runner=ghcr.io/${owner}/intrabin-runner" >> "$GITHUB_OUTPUT"
      - name: Build and push Intrabin
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --build-arg VERSION="${GITHUB_REF_NAME}" --build-arg COMMIT="${GITHUB_SHA}" \
            -t "${{ steps.names.outputs.app }}:${GITHUB_REF_NAME}" -t "${{ steps.names.outputs.app }}:latest" .
      - name: Build and push the Action Runner
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push -f Dockerfile.runner \
            --build-arg VERSION="${GITHUB_REF_NAME}" \
            -t "${{ steps.names.outputs.runner }}:${GITHUB_REF_NAME}" -t "${{ steps.names.outputs.runner }}:latest" .
      - name: GitHub release
        # Created after the images are published, so the update notice never points at a release
        # whose images are missing. Pre-release tags (v1.2.0-rc1) are never offered as updates.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 && exit 0
          pre=""
          case "${GITHUB_REF_NAME}" in *-*) pre="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --notes-file "docs/releases/${GITHUB_REF_NAME}.md" --title "Intrabin ${GITHUB_REF_NAME}" $pre
      - name: Publish downloadable images for restricted registries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ steps.names.outputs.app }}
          RUNNER_IMAGE: ${{ steps.names.outputs.runner }}
        run: |
          for arch in amd64 arm64; do
            for package in intrabin intrabin-runner; do
              image="$APP_IMAGE"
              if [ "$package" = intrabin-runner ]; then image="$RUNNER_IMAGE"; fi
              docker pull --platform "linux/$arch" "$image:$GITHUB_REF_NAME"
              archive="$package-linux-$arch.tar.gz"
              docker save "$image:$GITHUB_REF_NAME" | gzip -1 > "$archive"
              gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
              rm "$archive"
            done
          done
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
