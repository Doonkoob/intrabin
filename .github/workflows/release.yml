name: Release images
# Runs only when a version tag (v1.2.3) is pushed. Publishes multi-arch images to GitHub's container
# registry so the installer can pull them (install.sh --release v1.2.3) instead of building.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "app=ghcr.io/${owner}/intrabin" >> "$GITHUB_OUTPUT"
          echo "runner=ghcr.io/${owner}/intrabin-runner" >> "$GITHUB_OUTPUT"
      - name: Build and push Intrabin
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --build-arg VERSION="${GITHUB_REF_NAME}" \
            -t "${{ steps.names.outputs.app }}:${GITHUB_REF_NAME}" -t "${{ steps.names.outputs.app }}:latest" .
      - name: Build and push the Action Runner
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push -f Dockerfile.runner \
            -t "${{ steps.names.outputs.runner }}:${GITHUB_REF_NAME}" -t "${{ steps.names.outputs.runner }}:latest" .
